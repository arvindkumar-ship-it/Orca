# docker-compose.yml — local/dev/staging orchestration.
# Production (pilot/prod envs) swaps db/redis for managed services and keeps
# this same image set behind a container orchestrator (see runbook.sh).

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coastal_safety}
      POSTGRES_USER: ${POSTGRES_USER:-coastal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coastal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Module 26 workers — same image as api, different Celery queue per worker
  # so ingestion/risk/notification/escalation/cleanup can scale independently.
  worker_ingestion:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q ingestion -n ingestion@%h --concurrency=2
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker_risk:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q risk -n risk@%h --concurrency=2
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker_notification:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q notification -n notification@%h --concurrency=4
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker_escalation:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    # Module 27 wiring: this is the queue that runs check_ack_timeouts.
    command: celery -A app.workers.celery_app worker -Q escalation -n escalation@%h --concurrency=2
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker_cleanup:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q cleanup -n cleanup@%h --concurrency=1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    # single beat instance only — duplicate beats double-fire schedules
    # (would double-escalate incidents; see escalation_worker.py comment)
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    env_file: .env
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db_data: